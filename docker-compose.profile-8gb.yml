# Docker Compose Performance Profile Override: 8 GB Unified Memory / Constrained RAM
# Usage: docker compose -f docker-compose.yml -f docker-compose.profile-8gb.yml up -d

services:
  api:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      MAX_CONCURRENT_LLM_WORKERS: '1'
      DOCUMENT_PARSER_WORKERS: '1'
      OLLAMA_RESIDENCY_ENABLED: 'false'
      OLLAMA_KEEP_ALIVE: '3m'
      OLLAMA_GENERATION_NUM_CTX: '4096'
      OLLAMA_GENERATION_NUM_PREDICT: '1536'
      OLLAMA_OPTIMIZED_NUM_CTX: '8192'
      OLLAMA_OPTIMIZED_NUM_PREDICT: '2048'
      DOCLING_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    mem_limit: 768m
    cpus: 0.75

  worker:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      MAX_CONCURRENT_LLM_WORKERS: '1'
      DOCUMENT_PARSER_WORKERS: '1'
      OLLAMA_RESIDENCY_ENABLED: 'false'
      OLLAMA_KEEP_ALIVE: '3m'
      OLLAMA_GENERATION_NUM_CTX: '4096'
      OLLAMA_GENERATION_NUM_PREDICT: '1536'
      OLLAMA_OPTIMIZED_NUM_CTX: '8192'
      OLLAMA_OPTIMIZED_NUM_PREDICT: '2048'
      DOCLING_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    mem_limit: 2g
    cpus: 1.25

  auxiliary-worker:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      MAX_CONCURRENT_LLM_WORKERS: '1'
      DOCUMENT_PARSER_WORKERS: '1'
      DOCLING_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    mem_limit: 768m
    cpus: 0.5

  scheduler:
    mem_limit: 256m
    cpus: 0.25

  pgvector:
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=20"]
    mem_limit: 384m
    cpus: 0.50

  redis:
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    mem_limit: 96m
    cpus: 0.25
