# Lightweight Apple Silicon override for machines with 8 GB of unified memory.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d pgvector redis api worker auxiliary-worker scheduler

x-local-backend-environment: &local-backend-environment
  APP_ENVIRONMENT: development
  AUTH_ENABLED: '${AUTH_ENABLED:-false}'
  INITIALIZE_DATABASE_ON_STARTUP: "true"
  STARTUP_CACHE_WARMUP_ENABLED: "false"
  MSSQL_READ_ONLY_URL: '${MSSQL_READ_ONLY_URL}'
  MSSQL_READONLY_ENFORCEMENT: '${MSSQL_READONLY_ENFORCEMENT:-true}'
  POSTGRES_APP_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgvector:5432/${POSTGRES_DB:-cv_analyzer}'
  REDIS_URL: 'redis://redis:6379/0'
  RQ_QUEUE_NAME: '${RQ_QUEUE_NAME:-cv-processing}'
  RQ_AUXILIARY_QUEUE_NAME: '${RQ_AUXILIARY_QUEUE_NAME:-default}'
  RQ_SHADOW_QUEUE_NAME: '${RQ_SHADOW_QUEUE_NAME:-shadow_validation}'
  CV_PROCESSING_CONCURRENCY: '1'
  CV_QUEUE_MAX_SIZE: '${CV_QUEUE_MAX_SIZE:-1000}'
  RQ_WORKER_MAX_JOBS: '${RQ_WORKER_MAX_JOBS:-10}'
  RQ_MAINTENANCE_INTERVAL_SECONDS: '${RQ_MAINTENANCE_INTERVAL_SECONDS:-60}'
  RULE_CONFIG_RETRY_INTERVAL_SECONDS: '${RULE_CONFIG_RETRY_INTERVAL_SECONDS:-5}'
  CV_JOB_RECONCILIATION_INTERVAL_SECONDS: '${CV_JOB_RECONCILIATION_INTERVAL_SECONDS:-60}'
  CV_JOB_STALE_AFTER_SECONDS: '${CV_JOB_STALE_AFTER_SECONDS:-1200}'
  CV_JOB_HISTORY_HOURS: '${CV_JOB_HISTORY_HOURS:-24}'
  CV_JOB_LIST_LIMIT: '${CV_JOB_LIST_LIMIT:-100}'
  SHADOW_MODE_ENABLED: '${SHADOW_MODE_ENABLED:-false}'
  BACKGROUND_SYNC_ENABLED: '${BACKGROUND_SYNC_ENABLED:-true}'
  BACKGROUND_SYNC_INTERVAL_SECONDS: '${BACKGROUND_SYNC_INTERVAL_SECONDS:-900}'
  BACKGROUND_SYNC_JOB_TIMEOUT_SECONDS: '${BACKGROUND_SYNC_JOB_TIMEOUT_SECONDS:-1800}'
  BACKGROUND_SYNC_LOCK_TIMEOUT_SECONDS: '${BACKGROUND_SYNC_LOCK_TIMEOUT_SECONDS:-3600}'
  VALIDATION_METRICS_SNAPSHOT_ENABLED: '${VALIDATION_METRICS_SNAPSHOT_ENABLED:-true}'
  VALIDATION_METRICS_SNAPSHOT_INTERVAL_SECONDS: '${VALIDATION_METRICS_SNAPSHOT_INTERVAL_SECONDS:-86400}'
  LLM_ENABLED: '${LLM_ENABLED:-false}'
  EMBEDDING_ENABLED: '${EMBEDDING_ENABLED:-false}'
  EMBEDDING_MODEL: '${EMBEDDING_MODEL:-nomic-embed-text}'
  OLLAMA_CONNECT_TIMEOUT_SECONDS: '${OLLAMA_CONNECT_TIMEOUT_SECONDS:-3}'
  OLLAMA_TAGS_TIMEOUT_SECONDS: '${OLLAMA_TAGS_TIMEOUT_SECONDS:-3}'
  OLLAMA_EMBED_TIMEOUT_SECONDS: '${OLLAMA_EMBED_TIMEOUT_SECONDS:-30}'
  OLLAMA_UNLOAD_TIMEOUT_SECONDS: '${OLLAMA_UNLOAD_TIMEOUT_SECONDS:-10}'
  OLLAMA_MAX_RETRIES: '${OLLAMA_MAX_RETRIES:-0}'
  OLLAMA_RETRY_JITTER_SECONDS: '${OLLAMA_RETRY_JITTER_SECONDS:-0.1}'
  OLLAMA_KEEP_ALIVE: '${OLLAMA_KEEP_ALIVE:-1m}'
  OLLAMA_RESIDENCY_ENABLED: '${OLLAMA_RESIDENCY_ENABLED:-true}'
  OLLAMA_UNLOAD_ON_SHUTDOWN: "true"
  OLLAMA_MAX_CONNECTIONS: '${OLLAMA_MAX_CONNECTIONS:-1}'
  OLLAMA_MAX_KEEPALIVE_CONNECTIONS: '${OLLAMA_MAX_KEEPALIVE_CONNECTIONS:-1}'
  OLLAMA_MAX_RESPONSE_BYTES: '${OLLAMA_MAX_RESPONSE_BYTES:-4194304}'
  OLLAMA_LOCK_FILE: /app/uploads/.locks/ollama.lock
  OLLAMA_LOCK_TIMEOUT_SECONDS: '${OLLAMA_LOCK_TIMEOUT_SECONDS:-65}'
  OLLAMA_CIRCUIT_BREAKER_FAILURE_THRESHOLD: '${OLLAMA_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}'
  OLLAMA_CIRCUIT_BREAKER_RESET_SECONDS: '${OLLAMA_CIRCUIT_BREAKER_RESET_SECONDS:-60}'
  OLLAMA_EMBED_BATCH_SIZE: '${OLLAMA_EMBED_BATCH_SIZE:-10}'
  OLLAMA_EMBED_MIN_SPLIT_SIZE: '${OLLAMA_EMBED_MIN_SPLIT_SIZE:-2}'
  OLLAMA_EMBEDDING_EXPECTED_DIMENSION: '${OLLAMA_EMBEDDING_EXPECTED_DIMENSION:-768}'
  OLLAMA_EMBEDDING_MAX_DIMENSION: '${OLLAMA_EMBEDDING_MAX_DIMENSION:-4096}'
  OLLAMA_LIVE_TESTS_ENABLED: "false"
  OLLAMA_GENERATION_NUM_CTX: '${OLLAMA_GENERATION_NUM_CTX:-4096}'
  OLLAMA_GENERATION_NUM_PREDICT: '${OLLAMA_GENERATION_NUM_PREDICT:-1024}'
  OLLAMA_OPTIMIZED_NUM_CTX: '${OLLAMA_OPTIMIZED_NUM_CTX:?OLLAMA_OPTIMIZED_NUM_CTX must be set in the repository-root .env}'
  OLLAMA_OPTIMIZED_NUM_PREDICT: '${OLLAMA_OPTIMIZED_NUM_PREDICT:?OLLAMA_OPTIMIZED_NUM_PREDICT must be set in the repository-root .env}'
  MAX_CONCURRENT_LLM_WORKERS: '${MAX_CONCURRENT_LLM_WORKERS:-1}'
  DOCUMENT_PARSER_WORKERS: '${DOCUMENT_PARSER_WORKERS:-1}'
  EXTRACTION_TIMEOUT_SECONDS: '${EXTRACTION_TIMEOUT_SECONDS:-300}'
  SCANNED_EXTRACTION_TIMEOUT_SECONDS: '${SCANNED_EXTRACTION_TIMEOUT_SECONDS:-600}'
  DOCUMENT_TABLE_STRUCTURE_ENABLED: '${DOCUMENT_TABLE_STRUCTURE_ENABLED:-false}'
  PREFER_NATIVE_TEXT_EXTRACTION: '${PREFER_NATIVE_TEXT_EXTRACTION:-true}'
  DOCLING_NUM_THREADS: '${DOCLING_NUM_THREADS:-1}'
  DOCLING_INFERENCE_COMPILE_TORCH_MODELS: '${DOCLING_INFERENCE_COMPILE_TORCH_MODELS:-false}'
  OMP_NUM_THREADS: '${OMP_NUM_THREADS:-1}'
  OPENBLAS_NUM_THREADS: '${OPENBLAS_NUM_THREADS:-1}'
  MKL_NUM_THREADS: '${MKL_NUM_THREADS:-1}'
  NUMEXPR_NUM_THREADS: '${NUMEXPR_NUM_THREADS:-1}'
  MALLOC_ARENA_MAX: '${MALLOC_ARENA_MAX:-2}'

services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_MSSQL_ODBC: "true"
    environment:
      <<: *local-backend-environment
    volumes:
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]

  worker:
    build:
      context: ./backend
      args:
        INSTALL_MSSQL_ODBC: "true"
    command: ["python", "start_worker.py"]
    environment:
      <<: *local-backend-environment
    volumes:
      - ./backend/uploads:/app/uploads
      - docling_cache:/root/.cache/docling
      - huggingface_cache:/root/.cache/huggingface
    mem_limit: 2g
    cpus: 1.25
    pids_limit: 256

  auxiliary-worker:
    build:
      context: ./backend
      args:
        INSTALL_MSSQL_ODBC: "true"
    command: ["python", "start_aux_worker.py"]
    environment:
      <<: *local-backend-environment
    volumes:
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128

  scheduler:
    build:
      context: ./backend
      args:
        INSTALL_MSSQL_ODBC: "true"
    command: ["python", "start_scheduler.py"]
    environment:
      <<: *local-backend-environment
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

  pgvector:
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=20"]
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 96

  redis:
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64

volumes:
  docling_cache:
  huggingface_cache:
