[project]
name = "cv-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.115.0",
    "fastapi>=0.140.0",
    "filelock>=3.13.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "onnxruntime>=1.28.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pyodbc>=5.3.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "rq>=2.10.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

