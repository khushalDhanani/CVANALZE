# Docker Compose Performance Profile Override: 32+ GB Unified Memory / Dedicated VRAM
# Usage: docker compose -f docker-compose.yml -f docker-compose.profile-32gb.yml up -d

services:
  api:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      DOCUMENT_PARSER_WORKERS: '4'
      OLLAMA_RESIDENCY_ENABLED: 'true'
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_GENERATION_NUM_CTX: '16384'
      OLLAMA_GENERATION_NUM_PREDICT: '3072'
      OLLAMA_OPTIMIZED_NUM_CTX: '32768'
      OLLAMA_OPTIMIZED_NUM_PREDICT: '4096'
      DOCLING_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    mem_limit: 3g
    cpus: 3.0

  worker:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      DOCUMENT_PARSER_WORKERS: '4'
      OLLAMA_RESIDENCY_ENABLED: 'true'
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_GENERATION_NUM_CTX: '16384'
      OLLAMA_GENERATION_NUM_PREDICT: '3072'
      OLLAMA_OPTIMIZED_NUM_CTX: '32768'
      OLLAMA_OPTIMIZED_NUM_PREDICT: '4096'
      DOCLING_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    mem_limit: 8g
    cpus: 5.0

  auxiliary-worker:
    environment:
      CV_PROCESSING_CONCURRENCY: '1'
      DOCUMENT_PARSER_WORKERS: '4'
      DOCLING_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    mem_limit: 2g
    cpus: 2.0

  scheduler:
    mem_limit: 1g
    cpus: 1.0

  pgvector:
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB", "-c", "max_connections=100"]
    mem_limit: 2g
    cpus: 2.0

  redis:
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    mem_limit: 512m
    cpus: 1.0
